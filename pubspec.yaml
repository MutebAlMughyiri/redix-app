name: redix
description: "REDIX: Real Estate Development Intelligence"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cunning_document_scanner: ^3.1.0
  file_picker: ^13.3.3
  file_saver: ^0.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  home_widget: ^0.10.0
  http: ^1.6.0
  image: ^4.12.0
  mobile_scanner: ^7.5.0
  netoscope: ^0.2.4
  path_provider: ^2.1.6
  printing: ^5.15.1
  quick_actions: ^1.1.1
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: ^4.11.0
  flutter_launcher_icons: ^0.14.4
  qr: ^3.0.3
  url_launcher_platform_interface: ^2.3.2
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0E6B68"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

patrol:
  app_name: REDIX
  android:
    package_name: com.techdetails.redix.dev
  ios:
    bundle_id: com.techdetails.redix

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
