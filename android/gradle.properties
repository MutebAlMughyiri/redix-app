org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin. home_widget and patrol still make Flutter warn that they apply the Kotlin Gradle Plugin; both build with it on.
android.builtInKotlin=true

# Release builds keep every class: the Patrol cases run on a profile build, which is not shrunk, so what is tested is what is installed.
shrink=false
