name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No typo, in code, docs or words (redix-api #125); the words right as written are in _typos.toml
        uses: crate-ci/typos@v1.52.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define-from-file=config/dev.json

  ios:
    # The iPhone app compiles, unsigned, on every push: no Mac has ever built it (redix-app #118, R8).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=config/prod.json
