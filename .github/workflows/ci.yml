name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define-from-file=config/local.json

  patrol:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-only-Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-retries 12
    env:
      ConnectionStrings__Redix: Server=localhost;Database=Redix;User Id=sa;Password=Ci-only-Passw0rd;TrustServerCertificate=True
      REDIX_Owner__Username: ci-owner
      REDIX_Owner__Password: Ci-owner-passw0rd
    steps:
      - uses: actions/checkout@v4
        with:
          path: redix-app
      - name: Pick the redix-api branch of the same name, else main
        id: api
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.REDIX_API_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/MutebAlMughyiri/redix-api.git" "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: MutebAlMughyiri/redix-api
          ref: ${{ steps.api.outputs.ref }}
          token: ${{ secrets.REDIX_API_TOKEN }}
          path: redix-api
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create the database and start the API
        working-directory: redix-api
        run: |
          export REDIX_Jwt__SigningKey="$(openssl rand -base64 64 | tr -d '\n')"
          dotnet tool install --global dotnet-ef
          dotnet build src/Redix.Api
          dotnet ef database update --project src/Redix.Api --no-build
          nohup dotnet run --project src/Redix.Api --launch-profile http --no-build > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5010/health && break; sleep 2; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: dart pub global activate patrol_cli 4.8.0
      - run: flutter pub get
        working-directory: redix-app
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: redix-app
          script: adb reverse tcp:5010 tcp:5010 && patrol test --device emulator-5554 --dart-define-from-file=config/local.json --dart-define=TEST_USERNAME=${{ env.REDIX_Owner__Username }} --dart-define=TEST_PASSWORD=${{ env.REDIX_Owner__Password }} --dart-define=TEST_NEW_PASSWORD=Ci-chosen-passw0rd
