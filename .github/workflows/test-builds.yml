# The test builds, started by hand from Actions (redix-app #118): the APK on Linux, for Firebase App Distribution's testers (App Tester), and
# the IPA on GitHub's Mac, for TestFlight (D1). The build chosen - prod, qa or dev - is its own app, com.techdetails.redix and .qa and .dev
# beside it, and goes to its own group of testers, prod, qa or dev (the owner, 19 Nov 2026). The APK uploads only once it carries REDIX's upload
# key; without the secrets it still builds, debug-signed, and keeps what it built as the run's artifact. Every upload's build number is 100 and the
# run number (R6) - above the builds made by hand on the PC before this workflow, the last 1.0.7, which Android would otherwise call newer and
# refuse to replace - and its version is 1.0 and that number, so each build reads 1.0.106, 1.0.107 and on; the testers read what it changes as its release
# notes (the owner, 19 Nov 2026). Each build talks to its own server: prod to the one config/prod.json names, qa and dev to the instances beside it,
# qa.redix.muteb.net:8444 and dev.redix.muteb.net:8445 (redix-api #145 R25), which this workflow sets, so config/qa.json and dev.json keep
# naming the servers on the owner's PC, which his own builds and Patrol use (the owner, 19 Nov 2026: "The workflow sets it").
#
# Secrets:
#   Android:  ANDROID_UPLOAD_KEY (the .jks, base64, alias upload), ANDROID_UPLOAD_KEY_PASSWORD (the store's and the key's),
#             ANDROID_UPLOAD_KEY_SHA256 (its certificate's fingerprint), FIREBASE_ANDROID_APP_ID_PROD, _QA and _DEV,
#             FIREBASE_SERVICE_ACCOUNT (the JSON of redix-distribution, allowed to distribute and nothing else)
#   iPhone:   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY (the .p8's text), APPLE_TEAM_ID
name: Test builds

on:
  workflow_dispatch:
    inputs:
      build:
        description: The build, its app and its group of testers
        type: choice
        options: [prod, qa, dev]
        default: prod
      changes:
        description: What this build changes, which the testers read in App Tester
        type: string
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ inputs.build }}
      CHANGES: ${{ inputs.changes }}
      SIGNED: ${{ secrets.ANDROID_UPLOAD_KEY != '' }}
      DISTRIBUTED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: The build number, above every build made by hand (R6)
        run: echo "NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: The build's server, which a tester's phone reaches, never a PC's (R7, R13), and its links' host
        run: |
          case "$BUILD" in
            prod) server=$(jq -r .API_BASE_URL config/prod.json) ;;
            qa) server=https://qa.redix.muteb.net:8444 ;;
            dev) server=https://dev.redix.muteb.net:8445 ;;
          esac
          host=${server#https://}
          jq --arg server "$server" --arg host "${host%%:*}" '.API_BASE_URL = $server | .LINK_HOST = $host' "config/$BUILD.json" > "$RUNNER_TEMP/build.json"
          echo "$BUILD talks to $server"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: REDIX's upload key, from the secrets, never in the repo
        if: env.SIGNED == 'true'
        env:
          KEY: ${{ secrets.ANDROID_UPLOAD_KEY }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEY" | base64 -d > android/upload.jks
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties
      # One processor, 64-bit ARM: every phone of the last years, the HUAWEI among them; the 32-bit ARM and x86 builds a plain APK adds took
      # two-thirds of the build's six minutes (run 44770451611). Gradle and Flutter come from GitHub's cache, not downloaded each run.
      - run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=$RUNNER_TEMP/build.json --build-name=1.0.$NUMBER --build-number=$NUMBER
      - name: The APK carries REDIX's upload key, or nothing is sent (R4)
        if: env.SIGNED == 'true'
        env:
          EXPECTED: ${{ secrets.ANDROID_UPLOAD_KEY_SHA256 }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          signed=$("$tools/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ "$(echo "$signed" | tr -d ': ' | tr a-z A-Z)" != "$(echo "$EXPECTED" | tr -d ': ' | tr a-z A-Z)" ]; then
            echo "::error::the APK is not signed with REDIX's upload key"
            exit 1
          fi
      - name: To the build's group, through Firebase App Distribution
        if: env.SIGNED == 'true' && env.DISTRIBUTED == 'true'
        env:
          ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID_PROD: ${{ secrets.FIREBASE_ANDROID_APP_ID_PROD }}
          APP_ID_QA: ${{ secrets.FIREBASE_ANDROID_APP_ID_QA }}
          APP_ID_DEV: ${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}
        run: |
          echo "$ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          case "$BUILD" in prod) app="$APP_ID_PROD" ;; qa) app="$APP_ID_QA" ;; dev) app="$APP_ID_DEV" ;; esac
          npx --yes firebase-tools@15.37.0 appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$app" --groups "$BUILD" --release-notes "REDIX $BUILD 1.0.$NUMBER: $CHANGES"
      - uses: actions/upload-artifact@v7
        with:
          name: redix-${{ inputs.build }}-apk-${{ env.NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    # The iPhone app is com.techdetails.redix alone, so only the prod build goes to TestFlight.
    if: inputs.build == 'prod'
    runs-on: macos-latest
    env:
      SIGNED: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: The build number, above every build made by hand (R6)
        run: echo "NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - name: Unsigned, while the App Store Connect key is not set
        if: env.SIGNED != 'true'
        run: flutter build ipa --release --no-codesign --dart-define-from-file=config/prod.json --build-name=1.0.$NUMBER --build-number=$NUMBER
      - name: Signed by Xcode's cloud signing, with the App Store Connect key
        if: env.SIGNED == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist
          flutter build ios --release --no-codesign --dart-define-from-file=config/prod.json --build-name=1.0.$NUMBER --build-number=$NUMBER
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic "${auth[@]}" archive
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ios/ipa "${auth[@]}"
      - name: To TestFlight
        if: env.SIGNED == 'true'
        run: xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: redix-ios-${{ env.NUMBER }}
          path: |
            build/ios/ipa
            build/ios/archive
          if-no-files-found: ignore
