# Every Patrol class, in six groups each on its own Android emulator, against the Go API built from redix-api's main: nightly, and whenever someone starts it from
# Actions. It runs apart from CI, which checks every push in minutes, because it takes over an hour (the owner, 18 Nov 2026). The tests stay in
# this repo beside the widget keys they use, so a renamed key fails the app's own analysis at once.
name: Patrol

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  patrol:
    # Six groups of folders, each on its own emulator, so a crash ends only its own group's classes (findings row 268: one crash in Contracts
    # ended the run after 12 of 82). Every folder of patrol_test but support is in one group. Each failed group keeps the emulator's log, the
    # PC helper's and Patrol's own report.
    # Each group runs on a phone 411 points wide, the size of the ones REDIX runs on, and on one 360 wide with the real words, the narrowest
    # AC-N03 names (findings row 21): the same Pixel 6 screen, at the density that makes it that wide.
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: accounts-to-documents, folders: accounts approvals auth contracts documents }
          - { name: entries, folders: entries }
          - { name: history-to-sharing, folders: history home launcher notifications offline search sharing }
          - { name: money-partners-reports, folders: money partners reports }
          - { name: projects, folders: projects }
          - { name: settings-to-users, folders: settings structure suppliers users }
        phone:
          - { width: 411, density: 420 }
          - { width: 360, density: 480 }
    name: patrol (${{ matrix.group.name }}, ${{ matrix.phone.width }})
    runs-on: ubuntu-latest
    env:
      REDIX_Environment: Dev
      REDIX_Admin__Username: ci-admin
      REDIX_Admin__Password: Ci-admin-passw0rd
    steps:
      - uses: actions/checkout@v7
        with:
          path: redix-app
      - uses: actions/checkout@v7
        with:
          repository: MutebAlMughyiri/redix-api
          token: ${{ secrets.REDIX_API_TOKEN }}
          path: redix-api
      - uses: actions/setup-go@v5
        with:
          go-version-file: redix-api/go-backend/go.mod
          cache-dependency-path: redix-api/go-backend/go.sum
      - name: Start the API, which brings its database up to date as it starts
        working-directory: redix-api/go-backend
        run: |
          curl -sSfL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          export REDIX_Typst__Path="$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst"
          export REDIX_Jwt__SigningKey="$(openssl rand -base64 64 | tr -d '\n')"
          export REDIX_Database__Path="$RUNNER_TEMP/RedixDev.db"
          # The API writes its JSON with encoding/json/v2, an experiment in Go 1.27 (redix-api #125, #155).
          GOEXPERIMENT=jsonv2 go build -o "$RUNNER_TEMP/redix-server" ./cmd/server
          nohup "$RUNNER_TEMP/redix-server" > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5010/health && break; sleep 2; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: dart pub global activate patrol_cli 4.8.0
      - run: flutter pub get
        working-directory: redix-app
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          df -h /
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The longest group takes 45 minutes. Once, after its tests had ended, the emulator never shut down and held the job for four hours with
      # nothing kept to read; past this limit the step fails and the next step keeps the logs.
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 75
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # A phone the size of the ones REDIX runs on, 411 x 914: with no profile the emulator is 320 x 640, where dialogs sit under the keyboard and
          # the share screen overflows (findings row 268).
          profile: pixel_6
          # Room enough that its own launcher keeps up: with less it stalled, and its "isn't responding" dialog covered the screens (row 268).
          cores: 4
          ram-size: 4096M
          working-directory: redix-app
          # The launcher can hang once while the emulator boots, before this script runs, and its "isn't responding" dialog then stays for the whole
          # run, taking the Back presses and covering the phone's screens (row 268). hide_error_dialogs keeps any later one away, and stopping the
          # launcher closes one already shown; it starts again by itself.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell wm density ${{ matrix.phone.density }}
            adb reverse tcp:5010 tcp:5010 && adb reverse tcp:5011 tcp:5011
            nohup adb -s emulator-5554 logcat -v time > "$RUNNER_TEMP/logcat.txt" 2>&1 &
            nohup pwsh -NoProfile -File tool/patrol_pc_helper.ps1 -Device emulator-5554 -Results "$RUNNER_TEMP/patrol-results.log" > "$RUNNER_TEMP/pc-helper.log" 2>&1 &
            patrol test $(for folder in ${{ matrix.group.folders }}; do printf -- '--target patrol_test/%s ' "$folder"; done) --device emulator-5554 --dart-define-from-file=config/dev.json --dart-define=TEST_USERNAME=${{ env.REDIX_Admin__Username }} --dart-define=TEST_PASSWORD=${{ env.REDIX_Admin__Password }} --dart-define=TEST_NEW_PASSWORD=Ci-chosen-passw0rd
      - name: What a failed group leaves to read
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-${{ matrix.group.name }}-${{ matrix.phone.width }}
          path: |
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/pc-helper.log
            ${{ runner.temp }}/patrol-results.log
            redix-app/build/app/reports/androidTests
            redix-app/patrol_test/screenshots
            redix-api/go-backend/api.log
          if-no-files-found: ignore
